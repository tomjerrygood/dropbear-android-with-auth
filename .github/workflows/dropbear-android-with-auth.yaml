name: Build dropbear-android (tosiara / Geofferey repo build.sh)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v5

      # 拉取仓库，内含 build.sh + patch
      - name: Clone dropbear-android repo
        run: git clone https://gitlab.com/Geofferey/dropbear-android.git src-dropbear-android

      # 下载 NDK r11c，该仓库readme指定用r11c（仓库原生要求）
      - name: Download Android NDK r11c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r11c-linux-x86_64.zip
          unzip -q android-ndk-r11c-linux-x86_64.zip
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r11c" >> $GITHUB_ENV
          echo "PATH=$PWD/android-ndk-r11c:${PATH}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget unzip tar make git bzip2 patch

      # 执行仓库原生 build.sh（脚本内部自动下载dropbear源码+打补丁）
      - name: Run original build.sh
        working-directory: src-dropbear-android
        run: |
          chmod +x build.sh
          ./build.sh

      # 收集编译输出，仓库脚本输出路径 target/arm/dropbearmulti
      - name: Collect binaries
        run: |
          mkdir -p ./output
          cp src-dropbear-android/target/arm/dropbearmulti ./output/
          cd output
          ln -s dropbearmulti dropbear
          ln -s dropbearmulti dropbearkey
          ln -s dropbearmulti scp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-android-armv7
          path: output/
