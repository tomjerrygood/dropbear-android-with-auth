      - name: Cross compile armeabi-v7a (ARMv7 API24)
        run: |
          set -e
          set -x
          cd dropbear-2024.86
          export NDK=${{ env.NDK_ROOT }}
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=armv7a-linux-androideabi24
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/${TARGET}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}-clang++
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip

          echo -e "\n===== Write localoptions.h ====="
          cat > localoptions.h <<'EOF'
#define DROPBEAR_DEFAULT_PORT 2222
#define DROPBEAR_SFTPSERVER 1
#define DROPBEAR_USE_PASSWORD_AUTH 1
#define DROPBEAR_PUBKEY_AUTH 1
#define DROPBEAR_NO_X11 1
#define DROPBEAR_SMALL_CODE 1
#define DROPBEAR_AES 1
#define DROPBEAR_SHA2_256_HASH 1
#define DROPBEAR_SHA2_512_HASH 1
#define DROPBEAR_ED25519 1
#define DROPBEAR_DSS 0
#define DROPBEAR_RSA 1
EOF

          echo -e "\n===== Run configure ====="
          ./configure \
            --host=armv7a-linux-androideabi \
            --disable-zlib \
            --enable-static \
            --without-pam \
            --disable-utmp \
            --disable-utmpx \
            --disable-wtmp \
            --disable-wtmpx \
            --disable-loginfunc \
            --disable-pututxline

          echo -e "\n===== Start make ====="
          make -j$(nproc)
          echo -e "\n===== Strip binaries ====="
          $STRIP dropbear dbclient dropbearkey
          ./dropbear -V
