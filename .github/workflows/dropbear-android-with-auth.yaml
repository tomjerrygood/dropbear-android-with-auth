name: Build tosiara patched dropbear 2024.86 ARMv7
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout my repo
        uses: actions/checkout@v5

      - name: Clone tosiara/dropbear-android (patch files)
        run: git clone https://github.com/tosiara/dropbear-android.git patches-tosiara

      - name: Download Android NDK r21b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r21b-linux-x86_64.zip
          unzip -q android-ndk-r21b-linux-x86_64.zip
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r21b" >> $GITHUB_ENV
          echo "PATH=$PWD/android-ndk-r21b/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y wget unzip tar make git bzip2 patch

      - name: Download OFFICIAL dropbear 2024.86 source
        run: |
          wget -q https://matt.ucc.asn.au/dropbear/releases/dropbear-2024.86.tar.bz2
          tar -xjf dropbear-2024.86.tar.bz2
          cd dropbear-2024.86
          # apply tosiara patch
          patch -p1 < ../patches-tosiara/dropbear-android.patch

      - name: Prepare cross compile env
        run: |
          export TARGET_TRIPLE=armv7a-linux-androideabi28
          export CC=${TARGET_TRIPLE}-clang
          export CXX=${TARGET_TRIPLE}-clang++
          export AR=${TARGET_TRIPLE}-ar
          export CFLAGS="-march=armv7-a -mfpu=neon -mfloat-abi=softfp -fPIE -O2"
          export LDFLAGS="-pie"
          echo "TARGET_TRIPLE=${TARGET_TRIPLE}" >> $GITHUB_ENV
          echo "CC=${CC}" >> $GITHUB_ENV
          echo "CXX=${CXX}" >> $GITHUB_ENV
          echo "AR=${AR}" >> $GITHUB_ENV
          echo "CFLAGS=${CFLAGS}" >> $GITHUB_ENV
          echo "LDFLAGS=${LDFLAGS}" >> $GITHUB_ENV

      - name: Build dropbear (patched with tosiara auth patch)
        working-directory: dropbear-2024.86
        run: |
          ./configure \
            --host=${TARGET_TRIPLE} \
            CC="${CC}" \
            CXX="${CXX}" \
            AR="${AR}" \
            CFLAGS="${CFLAGS}" \
            LDFLAGS="${LDFLAGS}" \
            --disable-zlib
          make -j$(nproc)

      - name: Collect output binaries
        run: |
          mkdir -p ./output
          cp dropbear-2024.86/dropbearmulti ./output/
          cd output
          ln -s dropbearmulti dropbear
          ln -s dropbearmulti dropbearkey
          ln -s dropbearmulti scp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-tosiara-2024.86-armv7-api28
          path: output/
