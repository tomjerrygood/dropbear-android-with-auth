name: Build tosiara dropbear-android ARMv7
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout my repo
        uses: actions/checkout@v5

      - name: Clone tosiara/dropbear-android source
        run: git clone https://github.com/tosiara/dropbear-android.git src-tosiara

      - name: Download Android NDK r21b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r21b-linux-x86_64.zip
          unzip -q android-ndk-r21b-linux-x86_64.zip
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r21b" >> $GITHUB_ENV
          echo "PATH=$PWD/android-ndk-r21b:${PATH}" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y wget unzip tar make git

      - name: List source files for debug
        working-directory: src-tosiara
        run: ls -la

      - name: Build dropbear armv7 (native password auth)
        working-directory: src-tosiara
        run: |
          $ANDROID_NDK_ROOT/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            APP_ABI=armeabi-v7a \
            APP_PLATFORM=android-28
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Prepare output artifacts
        run: |
          mkdir -p ./output
          cp src-tosiara/libs/armeabi-v7a/dropbearmulti ./output/
          cd output
          ln -s dropbearmulti dropbear
          ln -s dropbearmulti dropbearkey
          ln -s dropbearmulti scp

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-tosiara-armv7-api28
          path: output/
